/* ───────────────────────── UI ───────────────────────── */
const $ = id => document.getElementById(id);
function setMode(m) {

}

  arm.material = v === 'xray' ? xrayMat : v === 'weights' ? weightMat : skinMat;
  arm.visible = v !== 'bones'; arm.castShadow = v !== 'xray';

  for (const nl of nails) nl.visible = v === 'skin';
}
for (const [k, m] of Object.entries(MODES)) { const b = document.createElement('button'); b.textContent = m.label; b.dataset.k = k; b.onclick = () => setMode(k); $('modes').append(b); }
for (const [k, l] of Object.entries(VIEWS)) { const b = document.createElement('button'); b.textContent = l; b.dataset.k = k; b.onclick = () => setView(k); $('views').append(b); }
addEventListener('keydown', e => {
  const ks = Object.keys(MODES), i = +e.key - 1;
  if (ks[i]) setMode(ks[i]);
  if (e.key === ' ') { paused = !paused; e.preventDefault(); }
  if (e.key === 'x') setView(view === 'xray' ? 'skin' : 'xray');
});

// orb dragging (registered before OrbitControls so it can claim the pointer first)
const el = renderer.domElement, ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane();
const setRay = e => { ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc, camera); };
el.addEventListener('pointerdown', e => {
  if (mode !== 'reach') return;
  setRay(e);
  if (ray.intersectObject(orbHit).length) {
    dragging = true; controls.enabled = false; el.setPointerCapture(e.pointerId); el.style.cursor = 'grabbing';
    plane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(tv).negate(), orb.position);
  }
}, true);
el.addEventListener('pointermove', e => {
  setRay(e);
  if (dragging) { if (ray.ray.intersectPlane(plane, tv)) { if (tv.length() > 0.8) tv.setLength(0.8); tv.y = Math.max(tv.y, (tv.z > 0.26 ? TY : FLOOR) + 0.034); orbGoal.copy(tv); } }
  else el.style.cursor = mode === 'reach' && ray.intersectObject(orbHit).length ? 'grab' : '';
});
const endDrag = () => { if (dragging) { dragging = false; controls.enabled = true; hold = 6; el.style.cursor = ''; } };
el.addEventListener('pointerup', endDrag); el.addEventListener('pointercancel', endDrag);

const controls = new OrbitControls(camera, el);
controls.target.set(0.15,-0.20,0.22); controls.enableDamping = true; controls.minDistance = 0.5; controls.maxDistance = 4; controls.maxPolarAngle = PI*0.62;
if (camera.aspect < 1.1) camera.position.sub(controls.target).multiplyScalar(Math.min(2, 1.15/camera.aspect)).add(controls.target);  // back off in portrait windows
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

setMode('reach'); setView('skin');
document.getElementById('loading')?.remove();
const clock = new THREE.Clock(); let hudT = 0;
let directing = false;
function frame() {
  if (directing) { requestAnimationFrame(frame); return; }
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) update(dt);
  controls.update();
  renderer.render(scene, camera);
  if ((hudT += dt) > 0.1) {
    hudT = 0;
    $('h-elbow').textContent = (flex*DEG).toFixed(0)+'°';
    $('h-twist').textContent = (twS.x*DEG).toFixed(0)+'°';
    $('h-wflex').textContent = (wflexS.x*DEG).toFixed(0)+'°';
    $('h-wdev').textContent = (wdevS.x*DEG).toFixed(0)+'°';
  }
  requestAnimationFrame(frame);
}
frame();

/* ───────────────────────── director: scripted two-panel showcase ─────────────────────────
   Renders a fixed timeline frame by frame (so it is identical every run and never drops frames):
   top panel = skin (or weights), bottom panel = x-ray with the skeleton, same camera in both. Each panel is 4:3.
   One second of motion is one second of video: nothing is slowed down.
   Each finished frame is posted to a local recorder, which writes the image files for encoding. */
async function direct({ fps = 60, PW = 1080, PH = 810, every = 1, post = '/frame' } = {}) {
  const SHOTS = [
    { mode:'reach', dur:9.0, title:'Reach & grab', sub:'two-bone IK · contact-aware fingers', bottom:'xray',
      cam:[[0.92,0.15,1.14],[0.19,-0.03,0.31],[0.44,0.24,1.24],[0.19,-0.03,0.31]],
      orb:[[0.0,[0.30,-0.12,0.42]],[2.3,[0.04,0.14,0.36]],[3.9,[0.36,0.17,0.30]],[5.4,[0.10,-0.17,0.46]],[7.0,[0.27,0.05,0.43]]] },
    { mode:'pick', dur:7.4, title:'Pick & place', sub:'fingers wrap joint by joint · table contact', bottom:'weights',
      cam:[[0.88,0.02,1.14],[0.17,-0.23,0.45],[0.52,0.06,1.26],[0.17,-0.23,0.45]] },
    { mode:'fist', dur:4.4, title:'Clench', sub:'thumb side · fingers roll shut, thumb lands a beat behind', bottom:'xray',
      cam:[[0.52,-0.10,0.68],[0.10,-0.215,0.34],[0.44,-0.03,0.74],[0.10,-0.215,0.34]] },
    { mode:'fist', dur:4.4, title:'Clench', sub:'other side · same motion from the little-finger side', bottom:'weights', keepTime:true, cut:true,
      cam:[[-0.30,-0.10,0.66],[0.10,-0.215,0.34],[-0.22,-0.02,0.74],[0.10,-0.215,0.34]] },
    { mode:'fist', dur:4.4, title:'Clench', sub:'forearm and biceps swell as the fist tightens', bottom:'xray', keepTime:true, cut:true,
      cam:[[0.96,-0.02,0.66],[0.20,-0.15,0.17],[1.02,0.04,0.46],[0.20,-0.14,0.15]] },
    { mode:'flow', dur:7.6, title:'Finger wave', sub:'a curl ripples through the fingers · 38 bones', bottom:'weights',
      cam:[[0.60,-0.04,0.76],[0.21,-0.09,0.39],[0.31,0.03,0.85],[0.21,-0.09,0.39]] },
  ];
  await envReady;
  directing = true; paused = true;
  for (const el of document.querySelectorAll('.ui')) el.style.display = 'none';
  const oldPR = renderer.getPixelRatio();
  renderer.setPixelRatio(1); renderer.setSize(PW, PH*2, false); renderer.setScissorTest(true);
  camera.aspect = PW/PH; camera.updateProjectionMatrix(); controls.enabled = false;
  const out = document.createElement('canvas'); out.width = PW; out.height = PH*2;
  const ctx = out.getContext('2d'), grad = ctx.createRadialGradient(PW*0.62, PH*0.64, 0, PW*0.62, PH*0.64, PW*1.1);
  grad.addColorStop(0, '#1b1f28'); grad.addColorStop(1, '#0a0b0f');
  const label = (txt, x, y, font, color, align = 'left') => { ctx.font = font; ctx.textAlign = align; ctx.fillStyle = color; ctx.fillText(txt, x, y); };
  const pos = new V3(), tgt = new V3(), a = new V3(), b = new V3(), prevPos = new V3(), prevTgt = new V3();
  const dt = 1/fps; let n = 0, sent = 0, first = true;
  time = 0;
  for (let si = 0; si < SHOTS.length; si++) {
    const S = SHOTS[si], frames = Math.round(S.dur*fps);
    if (!S.keepTime) { setMode(S.mode); time = 0; }
    paused = true; hold = 1e9;
    prevPos.copy(camera.position); prevTgt.copy(controls.target);
    for (let k = 0; k < frames; k++, n++) {
      const tl = k*dt;
      if (S.orb) { hold = 1e9; for (const [t0, g] of S.orb) if (tl >= t0) orbGoal.fromArray(g); }
      update(dt);
      const u = smooth(0, 1, tl/S.dur);
      pos.lerpVectors(a.fromArray(S.cam[0]), b.fromArray(S.cam[2]), u); tgt.lerpVectors(a.fromArray(S.cam[1]), b.fromArray(S.cam[3]), u);
      if (!first && !S.cut) { const e = smooth(0, 1.1, tl); pos.lerpVectors(prevPos, pos, e); tgt.lerpVectors(prevTgt, tgt, e); }   // glide in from the previous shot
      camera.position.copy(pos); camera.lookAt(tgt); controls.target.copy(tgt);
      if (n % every) continue;
      setView('skin'); renderer.setViewport(0, PH, PW, PH); renderer.setScissor(0, PH, PW, PH); renderer.render(scene, camera);
      setView(S.bottom); renderer.setViewport(0, 0,  PW, PH); renderer.setScissor(0, 0,  PW, PH); renderer.render(scene, camera);
      ctx.fillStyle = grad; ctx.fillRect(0, 0, PW, PH*2);
      ctx.drawImage(renderer.domElement, 0, 0);
      const shade = ctx.createLinearGradient(0, PH-170, 0, PH); shade.addColorStop(0, 'rgba(0,0,0,0)'); shade.addColorStop(1, 'rgba(0,0,0,0.55)');
      ctx.fillStyle = shade; ctx.fillRect(0, PH-170, PW, 170);
      ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(0, PH-1, PW, 2);
      const fade = Math.min(1, smooth(0.15, 0.7, tl), 1 - smooth(S.dur-0.45, S.dur-0.05, tl) * (SHOTS[si+1] && SHOTS[si+1].title === S.title ? 0 : 1));
      const fadeIn = SHOTS[si-1] && SHOTS[si-1].title === S.title ? 1 : fade;
      ctx.globalAlpha = Math.min(fade, fadeIn);
      label(S.title, 40, PH-58, '600 34px "Segoe UI", system-ui, sans-serif', '#e9edf5');
      ctx.globalAlpha = Math.min(1, smooth(0.15, 0.7, tl), 1 - smooth(S.dur-0.45, S.dur-0.05, tl));
      label(S.sub, 40, PH-28, '400 19px "Segoe UI", system-ui, sans-serif', '#9aa3b6');
      ctx.globalAlpha = 1;
      const tag = (txt, y) => { ctx.font = '600 15px "Segoe UI", system-ui, sans-serif'; const w = ctx.measureText(txt).width; ctx.fillStyle = 'rgba(0,0,0,0.42)'; ctx.fillRect(PW-36-w-12, y-21, w+24, 30); };
      tag('SKIN', 44); tag(S.bottom === 'weights' ? 'WEIGHTS' : 'SKELETON', PH+44);
      label('SKIN', PW-36, 44, '600 15px "Segoe UI", system-ui, sans-serif', '#7fd4ff', 'right');
      label(S.bottom === 'weights' ? 'WEIGHTS' : 'SKELETON', PW-36, PH+44, '600 15px "Segoe UI", system-ui, sans-serif', '#7fd4ff', 'right');
      const blob = await new Promise(r => out.toBlob(r, 'image/jpeg', 0.94));
      const res = await fetch(post + '?n=' + sent, { method:'POST', body: blob });
      if (!res.ok) throw new Error('recorder refused frame ' + sent);
      sent++;
    }
    first = false;
  }
  renderer.setScissorTest(false); renderer.setPixelRatio(oldPR); renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); controls.enabled = true;
  for (const el of document.querySelectorAll('.ui')) el.style.display = '';
  setView('skin'); directing = false; paused = false;
  return { frames: sent, seconds: n/fps };
}
window.rig = { direct, envReady, dbg:{ get pushUp() { return pushUp; }, setRoll: v => thumbRoll = v, chain, hits, HS, FINGERS, resolveFinger, P, curlS, spreadS }, setMode, setView, bones, arm, camera, controls, setTime: t => time = t, step: (s) => { for (let i = 0; i < s*60; i++) update(1/60); }, pause: v => paused = v };
</script>
